<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    user-select: none;
    -webkit-user-select: none;
  }
  body {
    display: flex;
    flex-direction: column;
    background: radial-gradient(120% 100% at 50% 0%, #16233d 0%, #0b1220 60%);
    color: #e2e8f0;
  }

  /* --- Barra superior --- */
  .topbar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    background: rgba(11,18,32,.6);
    border-bottom: 1px solid rgba(148,163,184,.12);
    padding-top: env(safe-area-inset-top);
  }
  .brand {
    flex: 1 1 auto;
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 0 12px;
    min-width: 0;
  }
  .brand img { width: clamp(26px, 4vh, 34px); height: clamp(26px, 4vh, 34px); display: block; }
  .brand span {
    font-weight: 800;
    letter-spacing: .04em;
    font-size: clamp(15px, 2.3vh, 20px);
    background: linear-gradient(90deg, #a5f3fc, #22d3ee);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .topbar button {
    border: none;
    background: transparent;
    color: #94a3b8;
    font-size: clamp(11px, 1.9vh, 15px);
    font-weight: 700;
    padding: 1.4vh 12px;
    text-transform: uppercase;
    letter-spacing: .05em;
    cursor: pointer;
  }
  .topbar button:active { color: #e2e8f0; }
  .topbar-coin { flex: 0 0 auto; display: flex; align-items: center; padding: 0 10px; }

  /* --- Vistas --- */
  .vista { flex: 1 1 auto; min-height: 0; display: none; flex-direction: column; }
  .vista.activa { display: flex; }

  /* --- Mapa de mundos (lienzo navegable con pan) --- */
  #vistaMapa { position: relative; overflow: hidden; }
  /* Viewport que captura el arrastre (pan) */
  .mapa-vp {
    position: absolute; inset: 0;
    overflow: hidden;
    cursor: grab;
    touch-action: none;
    background:
      radial-gradient(60% 50% at 30% 10%, rgba(34,211,238,.07), transparent 70%),
      radial-gradient(55% 45% at 80% 60%, rgba(217,180,254,.06), transparent 70%);
  }
  .mapa-vp.dragging { cursor: grabbing; }
  /* Mundo (lienzo grande que se traslada con el pan) */
  #mapaMundo {
    position: absolute; top: 0; left: 0;
    transform-origin: 0 0;
    will-change: transform;
  }
  #mapaSvg { position: absolute; top: 0; left: 0; pointer-events: none; }

  /* Cabecera flotante del mundo actual */
  .mapa-hud {
    position: absolute; top: 0; left: 0; right: 0; z-index: 3;
    display: flex; align-items: center; gap: 10px;
    padding: calc(env(safe-area-inset-top) + 1.2vh) 4vw 1.2vh;
    background: linear-gradient(180deg, rgba(11,18,32,.9), rgba(11,18,32,0));
    pointer-events: none;
  }
  .mapa-hud .mh-num { font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--tint, #22d3ee); }
  .mapa-hud .mh-nombre { font-size: clamp(17px, 2.6vh, 22px); font-weight: 800; color: #f1f5f9; line-height: 1.05; }
  .mapa-hud .mh-feat { font-size: clamp(10px, 1.5vh, 13px); color: #94a3b8; }
  .mapa-hud .mh-stars { margin-left: auto; font-weight: 800; color: #fcd34d; font-size: clamp(13px, 2vh, 16px); }

  /* Nodo de nivel posicionado en el lienzo */
  .nivel-nodo {
    position: absolute;
    width: 64px; height: 64px;
    margin: -32px 0 0 -32px;            /* centrar en (x,y) */
    border-radius: 50%;
    border: 3px solid color-mix(in srgb, var(--tint) 65%, #fff 0%);
    background: radial-gradient(circle at 50% 32%, color-mix(in srgb, var(--tint) 50%, #0b1220), #0b1220);
    color: #e2e8f0;
    cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 1px;
    box-shadow: 0 6px 16px rgba(0,0,0,.45);
    transition: transform .12s ease, box-shadow .15s ease;
    z-index: 2;
  }
  .nivel-nodo:active { transform: scale(.92); }
  .nivel-nodo .nn { font-size: 21px; font-weight: 800; line-height: 1; }
  .nivel-nodo .ne { font-size: 10px; letter-spacing: -1px; color: #fcd34d; }
  .nivel-nodo.bloq {
    border-color: rgba(148,163,184,.3);
    background: rgba(148,163,184,.08);
    color: #64748b; cursor: default; box-shadow: none;
  }
  .nivel-nodo.bloq .ne { color: #fcd34d; }
  .nivel-nodo.actual {
    box-shadow: 0 0 0 4px color-mix(in srgb, var(--tint) 55%, transparent), 0 0 26px color-mix(in srgb, var(--tint) 60%, transparent);
    animation: latePulse 1.6s ease-in-out infinite;
  }
  @keyframes latePulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }

  /* Portal de entrada a un mundo */
  .portal {
    position: absolute;
    width: 92px; height: 92px;
    margin: -46px 0 0 -46px;
    border-radius: 50%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    cursor: pointer; z-index: 2;
    color: #06121b; font-weight: 800; text-align: center;
    border: 3px solid color-mix(in srgb, var(--tint) 80%, #fff);
    background:
      radial-gradient(circle at 50% 50%, #fff 0%, color-mix(in srgb, var(--tint) 70%, #0b1220) 45%, #0b1220 100%);
    box-shadow: 0 0 28px color-mix(in srgb, var(--tint) 55%, transparent);
  }
  .portal .pn { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: #e2e8f0; }
  .portal .pw { font-size: clamp(12px, 1.7vh, 15px); color: #fff; }
  .portal.bloq {
    cursor: default; color: #94a3b8;
    border-color: rgba(252,211,77,.5);
    background: radial-gradient(circle at 50% 50%, rgba(148,163,184,.15), #0b1220 70%);
    box-shadow: none;
  }
  .portal .plock { font-size: 13px; font-weight: 800; color: #fcd34d; }

  /* Pista de "arrastra para explorar" */
  .mapa-hint {
    position: absolute; left: 50%; bottom: calc(1.4vh + env(safe-area-inset-bottom));
    transform: translateX(-50%); z-index: 3;
    font-size: clamp(11px, 1.7vh, 14px); color: #94a3b8;
    background: rgba(11,18,32,.7); border: 1px solid rgba(148,163,184,.18);
    padding: 6px 14px; border-radius: 50px; pointer-events: none;
    transition: opacity .4s ease;
  }
  /* Botón "ir al nivel actual" (re-centra) */
  .mapa-recenter {
    position: absolute; right: 4vw; bottom: calc(1.4vh + env(safe-area-inset-bottom));
    z-index: 3;
    border: 1px solid rgba(148,163,184,.25); background: rgba(11,18,32,.8);
    color: #e2e8f0; font-weight: 700; font-size: clamp(12px, 1.9vh, 15px);
    border-radius: 50px; padding: 9px 16px; cursor: pointer;
  }
  .mapa-recenter:active { background: rgba(148,163,184,.2); }

  /* --- HUD de juego --- */
  .scores {
    flex: 0 0 auto;
    display: flex;
    gap: 2vw;
    padding: 1.2vh 3vw .3vh;
  }
  .score {
    flex: 1;
    text-align: center;
    background: rgba(148,163,184,.07);
    border: 1px solid rgba(148,163,184,.12);
    border-radius: 14px;
    padding: .9vh .4vh;
    min-width: 0;
  }
  .score .lbl {
    font-size: clamp(9px, 1.35vh, 12px);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .1em;
    color: #64748b;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .score .val {
    font-size: clamp(18px, 3.6vh, 30px);
    font-weight: 800;
    line-height: 1.1;
    font-variant-numeric: tabular-nums;
    color: #f1f5f9;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .score.obj .val { font-size: clamp(14px, 2.6vh, 22px); }
  .score.obj .val.romper { color: #fcd34d; }

  /* --- Tablero --- */
  .board-wrap {
    flex: 1 1 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 0;
    padding: 1vh 3vw;
  }
  #board {
    display: block;
    touch-action: none;
    border-radius: 16px;
    background: rgba(8,13,24,.55);
    box-shadow: inset 0 0 0 1px rgba(148,163,184,.1), 0 10px 30px rgba(0,0,0,.4);
    max-width: 100%;
    max-height: 100%;
  }

  /* --- Combo flotante --- */
  .combo {
    position: fixed;
    left: 50%; top: 44%;
    transform: translate(-50%,-50%) scale(.6);
    font-size: clamp(28px, 9vw, 64px);
    font-weight: 900;
    letter-spacing: .02em;
    color: #fde68a;
    text-shadow: 0 2px 18px rgba(252,211,77,.55);
    pointer-events: none;
    opacity: 0;
    z-index: 5;
  }
  .combo.show { animation: comboPop .8s ease-out; }
  @keyframes comboPop {
    0%   { opacity: 0; transform: translate(-50%,-50%) scale(.5); }
    25%  { opacity: 1; transform: translate(-50%,-50%) scale(1.15); }
    70%  { opacity: 1; transform: translate(-50%,-60%) scale(1); }
    100% { opacity: 0; transform: translate(-50%,-80%) scale(.9); }
  }

  /* --- Barra inferior --- */
  .control {
    flex: 0 0 auto;
    display: flex;
    gap: 3vw;
    padding: 1vh 4vw;
    padding-bottom: calc(1vh + env(safe-area-inset-bottom));
  }
  .control button {
    flex: 1;
    border: none;
    border-radius: 14px;
    background: rgba(148,163,184,.1);
    color: #e2e8f0;
    font-size: clamp(13px, 2vh, 17px);
    font-weight: 700;
    padding: 1.4vh 0;
    text-transform: uppercase;
    letter-spacing: .05em;
    cursor: pointer;
  }
  .control button:active { background: rgba(148,163,184,.22); }
  .control .primary {
    background: linear-gradient(90deg, #0891b2, #06b6d4);
    color: #06121b;
  }
  .control .primary:active { filter: brightness(1.1); }

  /* --- Modal --- */
  .modal {
    position: fixed; inset: 0;
    background: rgba(2,6,15,.82);
    display: none; align-items: center; justify-content: center;
    z-index: 10; padding: 5vh 6vw;
  }
  .modal.abierto { display: flex; }
  .modal-caja {
    background: #111c30;
    border: 1px solid rgba(148,163,184,.16);
    border-radius: 18px;
    width: 100%; max-width: 380px;
    padding: 26px 24px;
    text-align: center;
  }
  .modal-caja h2 {
    font-size: clamp(20px, 3.4vh, 28px);
    font-weight: 800;
    margin-bottom: 6px;
    background: linear-gradient(90deg, #a5f3fc, #22d3ee);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .modal-caja p { color: #94a3b8; font-size: clamp(13px, 2vh, 16px); line-height: 1.5; }
  .estrellas { font-size: clamp(30px, 7vh, 46px); margin: 10px 0 4px; letter-spacing: 4px; }
  .estrellas .on { color: #fcd34d; text-shadow: 0 2px 12px rgba(252,211,77,.5); }
  .estrellas .off { color: #334155; }
  .modal-botones { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
  .modal-caja button {
    width: 100%;
    border: none; border-radius: 14px;
    background: linear-gradient(90deg, #0891b2, #06b6d4);
    color: #06121b; font-size: clamp(15px, 2.4vh, 19px); font-weight: 800;
    padding: 13px 0; cursor: pointer; text-transform: uppercase; letter-spacing: .05em;
  }
  .modal-caja button.sec {
    background: rgba(148,163,184,.14); color: #e2e8f0;
  }
  .modal-caja button:active { filter: brightness(1.1); }

  /* --- Glosario / Guia --- */
  .modal.glos { align-items: stretch; justify-content: center; padding: 0; }
  .glos-caja { background: #0e1726; width: 100%; max-width: 560px; display: flex; flex-direction: column; max-height: 100%; }
  .glos-head { flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; padding: calc(env(safe-area-inset-top) + 14px) 18px 12px; border-bottom: 1px solid rgba(148,163,184,.14); background: rgba(11,18,32,.9); }
  .glos-head h2 { font-size: clamp(18px, 3vh, 24px); font-weight: 800; background: linear-gradient(90deg, #a5f3fc, #22d3ee); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .glos-cerrar { border: none; background: rgba(148,163,184,.14); color: #e2e8f0; width: 36px; height: 36px; border-radius: 50%; font-size: 18px; cursor: pointer; }
  .glos-cerrar:active { background: rgba(148,163,184,.28); }
  .glos-body { flex: 1 1 auto; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 14px 16px calc(env(safe-area-inset-bottom) + 24px); }
  .glos-sec { margin-top: 18px; }
  .glos-sec:first-child { margin-top: 4px; }
  .glos-sec > h3 { font-size: clamp(13px, 2vh, 16px); font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: #22d3ee; margin-bottom: 8px; }
  .glos-item { display: flex; align-items: center; gap: 12px; padding: 9px 0; border-bottom: 1px solid rgba(148,163,184,.08); }
  .glos-item:last-child { border-bottom: none; }
  .glos-ic { flex: 0 0 auto; width: 46px; height: 46px; display: block; }
  .glos-ic.wide { width: 76px; }
  .glos-tx { min-width: 0; }
  .glos-tx b { display: block; font-size: clamp(14px, 2vh, 16px); color: #f1f5f9; }
  .glos-tx span { font-size: clamp(12px, 1.7vh, 14px); color: #94a3b8; line-height: 1.4; }
  .glos-tx .how { color: #fcd34d; }
</style>

<script>
  const $ = id => document.getElementById(id);

  /* ===================== Configuración ===================== */
  const N = 8;                 // tablero N×N
  const PT_GEMA = 12;          // puntos por gema eliminada
  const NIVELES_POR_MUNDO = 10;
  const PROG_KEY = 'diamonds_prog';

  // Paleta de gemas (claro arriba, oscuro abajo => aspecto de diamante)
  const COLORES = [
    ['#fda4af', '#e11d48'], // rojo
    ['#fdba74', '#ea580c'], // naranja
    ['#fde047', '#ca8a04'], // amarillo
    ['#86efac', '#16a34a'], // verde
    ['#7dd3fc', '#0284c7'], // azul
    ['#d8b4fe', '#9333ea']  // violeta
  ];

  // Mundos: cada uno añade una mecánica. Más allá del último se repite "Caos"
  // y la dificultad sigue escalando por fórmula.
  const MUNDOS = [
    { nombre: 'Cristal',  tint: '#22d3ee', feat: 'Combina y crea poderes' },
    { nombre: 'Escarcha', tint: '#7dd3fc', feat: 'Diamantes duros (2 golpes)' },
    { nombre: 'Prisma',   tint: '#d8b4fe', feat: 'Un color más' },
    { nombre: 'Roca',     tint: '#a8a29e', feat: 'Diamantes reforzados (3 golpes)' },
    { nombre: 'Tormenta', tint: '#fbbf24', feat: 'Menos movimientos, más objetivos' },
    { nombre: 'Caos',     tint: '#fb7185', feat: 'Todo combinado' },
  ];
  const mundoDeNivel = n => Math.floor((n - 1) / NIVELES_POR_MUNDO) + 1;
  const nivelEnMundo = n => ((n - 1) % NIVELES_POR_MUNDO) + 1;
  const infoMundo = w => MUNDOS[Math.min(w - 1, MUNDOS.length - 1)];

  // --- Estrellas como llave ---
  // Estrellas totales acumuladas (suma de las mejores por nivel).
  function estrellasTotales() {
    let s = 0; for (const k in prog.stars) s += prog.stars[k] || 0; return s;
  }
  // Estrellas necesarias para entrar al mundo w (puerta del nivel 1).
  function reqMundo(w) { return w <= 1 ? 0 : Math.floor((w - 1) * NIVELES_POR_MUNDO * 3 * 0.45); }
  // Estrellas que exige el nivel n (0 = ninguna). Puerta de mundo (em=1) y
  // nivel "jefe" al final de cada mundo (em=último).
  function reqNivel(n) {
    const w = mundoDeNivel(n), em = nivelEnMundo(n);
    if (em === 1) return reqMundo(w);
    if (em === NIVELES_POR_MUNDO) return reqMundo(w) + Math.round(NIVELES_POR_MUNDO * 1.5);
    return 0;
  }
  // Un nivel es jugable si llegó la progresión y se reúnen las estrellas.
  function desbloqueado(n) { return n <= prog.max && estrellasTotales() >= reqNivel(n); }

  // Mecánicas desbloqueadas por mundo (incremental).
  function features(w) {
    return {
      colores: w >= 3 ? 6 : 5,   // Prisma añade el 6º color
      duros: w >= 2,             // Escarcha: diamantes de 2 golpes
      reforzados: w >= 4,        // Roca: pueden ser de 3 golpes
    };
  }

  // RNG determinista (mulberry32): cada nivel se genera igual siempre.
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  // Definición determinista del nivel n (1-based global).
  function defNivel(n) {
    const w = mundoDeNivel(n), em = nivelEnMundo(n);
    const f = features(w);
    const rng = mulberry32((Math.imul(n, 2654435761) ^ 0x9e3779b9) >>> 0);
    const tipo = (f.duros && em % 2 === 0) ? 'romper' : 'puntos';
    const movs = Math.max(14, 30 - (w - 1) * 2 - Math.floor((em - 1) / 2));
    let duros = 0;
    if (f.duros) {
      duros = tipo === 'romper' ? (3 + w + Math.floor(em / 2)) : Math.floor(rng() * 3);
      duros = Math.min(duros, 18);
    }
    const objetivoPuntos = tipo === 'puntos'
      ? Math.round((600 + w * 320 + em * 200) / 10) * 10
      : 0;
    return { n, w, em, tipo, movs, colores: f.colores, duros, reforzados: f.reforzados,
             objetivoPuntos, rng, info: infoMundo(w) };
  }

  /* ===================== Estado ===================== */
  const cv = $('board');
  const ctx = cv.getContext('2d');
  let cell = 48, dpr = 1;
  let grid = [];
  let estado = 'idle';         // 'idle' | 'busy'
  let sel = null;
  let score = 0, movs = 0, objRestante = 0;
  let endless = false;         // modo libre: sin límite de movimientos
  let def = defNivel(1);
  let vista = 'mapa';
  let tweens = [];
  let fx = [];                 // partículas / haces / ondas (efectos visuales)
  let nowMs = 0;               // reloj para pulsos (palpitar)
  let fxBeams = [];            // haces encolados por la detonación en curso

  let prog = cargarProg();
  function cargarProg() {
    try { const d = JSON.parse(localStorage.getItem(PROG_KEY)); if (d && d.stars) return { max: d.max || 1, stars: d.stars || {} }; } catch {}
    return { max: 1, stars: {} };
  }
  function guardarProg() { localStorage.setItem(PROG_KEY, JSON.stringify(prog)); }

  // Fábrica de gemas
  function gem(r, c, t) { return { tipo: t, hp: 1, hpMax: 1, power: null, objetivo: false, objColor: null, dr: r, dc: c, scale: 1, charge: 0 }; }
  const I = (r, c) => r * N + c;
  const at = i => grid[(i / N) | 0][i % N];

  /* ===================== Tweens ===================== */
  function tween(obj, props, dur, ease) {
    const from = {}; for (const k in props) from[k] = obj[k];
    return new Promise(res => tweens.push({ obj, props, from, dur, t: 0, ease: ease || easeOutQuad, done: res }));
  }
  function easeOutQuad(t) { return 1 - (1 - t) * (1 - t); }
  function easeInQuad(t) { return t * t; }
  function easeOutBack(t) { const c = 1.7; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); }

  let lastTs = 0;
  function loop(ts) {
    const dt = lastTs ? (ts - lastTs) : 16;
    lastTs = ts; nowMs = ts;
    for (let i = tweens.length - 1; i >= 0; i--) {
      const tw = tweens[i];
      tw.t += dt;
      const k = Math.min(1, tw.t / tw.dur), e = tw.ease(k);
      for (const p in tw.props) tw.obj[p] = tw.from[p] + (tw.props[p] - tw.from[p]) * e;
      if (k >= 1) { tweens.splice(i, 1); tw.done(); }
    }
    actualizarFx(dt);
    if (vista === 'juego') dibujar();
    requestAnimationFrame(loop);
  }

  /* ===================== FX (partículas, haces, ondas) ===================== */
  function actualizarFx(dt) {
    const s = Math.min(dt, 40) / 1000;       // seg. (clamp para no saltar)
    for (let i = fx.length - 1; i >= 0; i--) {
      const p = fx[i];
      p.t += dt;
      if (p.kind === 'shard') {
        p.vy += 1400 * s;                    // gravedad
        p.x += p.vx * s; p.y += p.vy * s; p.rot += p.vr * s;
      }
      if (p.t >= p.dur) fx.splice(i, 1);
    }
  }

  const centroX = c => (c + 0.5) * cell;
  const centroY = r => (r + 0.5) * cell;

  // Estallido en pedazos: esquirlas triangulares que salen volando.
  function spawnEsquirlas(cx, cy, c1, c2) {
    const n = 7 + ((Math.random() * 4) | 0);
    for (let k = 0; k < n; k++) {
      const ang = Math.random() * Math.PI * 2;
      const spd = cell * (2.2 + Math.random() * 3.2);
      fx.push({
        kind: 'shard', x: cx, y: cy,
        vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd - cell * 1.5,
        rot: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 14,
        size: cell * (0.12 + Math.random() * 0.13),
        color: Math.random() < 0.5 ? c1 : c2,
        t: 0, dur: 360 + Math.random() * 240
      });
    }
    // destello breve
    fx.push({ kind: 'flash', x: cx, y: cy, r: cell * 0.55, t: 0, dur: 180 });
  }

  // Haz que fluye de (r0,c0) a (r1,c1).
  function spawnHaz(r0, c0, r1, c1, color) {
    fx.push({ kind: 'beam', x0: centroX(c0), y0: centroY(r0), x1: centroX(c1), y1: centroY(r1), color, t: 0, dur: 300 });
  }
  // Onda expansiva (bomba).
  function spawnOnda(r, c, radio, color) {
    fx.push({ kind: 'ring', x: centroX(c), y: centroY(r), r: radio, color, t: 0, dur: 320 });
  }

  function dibujarFx() {
    for (const p of fx) {
      const k = p.t / p.dur, vida = 1 - k;
      if (p.kind === 'beam') {
        // línea que fluye: tramo brillante que viaja del origen al destino
        const head = Math.min(1, k * 1.6);
        const hx = p.x0 + (p.x1 - p.x0) * head, hy = p.y0 + (p.y1 - p.y0) * head;
        const grad = ctx.createLinearGradient(p.x0, p.y0, hx, hy);
        grad.addColorStop(0, 'rgba(255,255,255,0)');
        grad.addColorStop(1, p.color);
        ctx.strokeStyle = grad;
        ctx.lineWidth = cell * 0.30 * vida + cell * 0.05;
        ctx.lineCap = 'round';
        ctx.globalAlpha = Math.min(1, vida * 1.4);
        ctx.beginPath(); ctx.moveTo(p.x0, p.y0); ctx.lineTo(hx, hy); ctx.stroke();
        // núcleo blanco en la cabeza
        ctx.globalAlpha = vida;
        ctx.fillStyle = 'rgba(255,255,255,.95)';
        ctx.beginPath(); ctx.arc(hx, hy, cell * 0.12 * vida + cell * 0.03, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = 1; ctx.lineCap = 'butt';
      } else if (p.kind === 'ring') {
        const rad = p.r * easeOutQuad(k);
        ctx.strokeStyle = p.color; ctx.globalAlpha = vida;
        ctx.lineWidth = cell * 0.16 * vida + cell * 0.03;
        ctx.beginPath(); ctx.arc(p.x, p.y, rad, 0, Math.PI * 2); ctx.stroke();
        ctx.globalAlpha = 1;
      } else if (p.kind === 'flash') {
        const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * (1 + k));
        g.addColorStop(0, 'rgba(255,255,255,' + (0.85 * vida) + ')');
        g.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (1 + k), 0, Math.PI * 2); ctx.fill();
      } else if (p.kind === 'shard') {
        ctx.save();
        ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        ctx.globalAlpha = Math.min(1, vida * 1.6);
        ctx.fillStyle = p.color;
        const s = p.size;
        ctx.beginPath(); ctx.moveTo(0, -s); ctx.lineTo(s * 0.8, s * 0.6); ctx.lineTo(-s * 0.8, s * 0.6); ctx.closePath(); ctx.fill();
        ctx.restore(); ctx.globalAlpha = 1;
      }
    }
  }

  /* ===================== Dimensionado ===================== */
  function medir() {
    const wrap = cv.parentElement;
    const rect = wrap.getBoundingClientRect();
    const lado = Math.floor(Math.min(rect.width, rect.height));
    if (lado <= 0) return;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.style.width = lado + 'px';
    cv.style.height = lado + 'px';
    cv.width = Math.floor(lado * dpr);
    cv.height = Math.floor(lado * dpr);
    cell = (lado * dpr) / N;
  }

  /* ===================== Dibujo ===================== */
  function dibujar() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      if ((r + c) % 2 === 0) { ctx.fillStyle = 'rgba(148,163,184,.04)'; ctx.fillRect(c * cell, r * cell, cell, cell); }
    }
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      const g = grid[r][c];
      if (g && g.tipo >= 0) dibujarGema(g, sel && sel.r === r && sel.c === c);
    }
    dibujarFx();
  }

  function rombo(cx, cy, half) {
    ctx.beginPath();
    ctx.moveTo(cx, cy - half); ctx.lineTo(cx + half, cy);
    ctx.lineTo(cx, cy + half); ctx.lineTo(cx - half, cy);
    ctx.closePath();
  }

  function dibujarGema(g, seleccionada) {
    const cx = (g.dc + 0.5) * cell, cy = (g.dr + 0.5) * cell;
    const half = cell * 0.40 * g.scale;
    const esEstrella = g.power === 'estrella';

    // Luz palpitante de "carga" justo antes de explotar
    if (g.charge > 0) {
      const pulso = 0.55 + 0.45 * Math.sin(nowMs / 45);
      const a = g.charge * pulso;
      const rg = ctx.createRadialGradient(cx, cy, 0, cx, cy, cell * 0.62);
      rg.addColorStop(0, 'rgba(255,255,255,' + (0.9 * a) + ')');
      rg.addColorStop(0.5, 'rgba(255,255,255,' + (0.35 * a) + ')');
      rg.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = rg;
      ctx.beginPath(); ctx.arc(cx, cy, cell * 0.62, 0, Math.PI * 2); ctx.fill();
    }

    if (seleccionada) {
      ctx.fillStyle = 'rgba(255,255,255,.10)';
      ctx.beginPath(); ctx.arc(cx, cy, cell * 0.46, 0, Math.PI * 2); ctx.fill();
    }

    // Base de piedra para diamantes duros
    if (g.hpMax > 1) {
      const tono = g.hpMax >= 3 ? '#57534e' : '#78716c';
      ctx.fillStyle = tono;
      const s = cell * 0.46 * g.scale;
      const rr = cell * 0.12;
      roundRect(cx - s, cy - s, s * 2, s * 2, rr); ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,.3)'; ctx.lineWidth = Math.max(1, cell * 0.02);
      roundRect(cx - s, cy - s, s * 2, s * 2, rr); ctx.stroke();
    }

    const [c1, c2] = esEstrella ? ['#f8fafc', '#cbd5e1'] : COLORES[g.tipo];
    const grad = ctx.createLinearGradient(cx, cy - half, cx, cy + half);
    grad.addColorStop(0, c1); grad.addColorStop(1, c2);
    rombo(cx, cy, half); ctx.fillStyle = grad; ctx.fill();

    // Facetas
    rombo(cx, cy, half * 0.55); ctx.fillStyle = 'rgba(255,255,255,.16)'; ctx.fill();
    ctx.beginPath();
    ctx.moveTo(cx, cy - half); ctx.lineTo(cx + half * 0.35, cy - half * 0.32); ctx.lineTo(cx - half * 0.35, cy - half * 0.32);
    ctx.closePath(); ctx.fillStyle = 'rgba(255,255,255,.45)'; ctx.fill();

    // Borde
    ctx.lineWidth = Math.max(1, cell * 0.02); ctx.strokeStyle = 'rgba(0,0,0,.18)';
    rombo(cx, cy, half); ctx.stroke();

    // Grietas si está dañado
    if (g.hpMax > 1 && g.hp < g.hpMax) {
      ctx.strokeStyle = 'rgba(15,23,42,.65)'; ctx.lineWidth = Math.max(1, cell * 0.03);
      ctx.beginPath();
      ctx.moveTo(cx - half * 0.5, cy - half * 0.2); ctx.lineTo(cx, cy + half * 0.1); ctx.lineTo(cx + half * 0.45, cy - half * 0.35);
      if (g.hp <= g.hpMax - 2) { ctx.moveTo(cx - half * 0.1, cy + half * 0.5); ctx.lineTo(cx + half * 0.2, cy - half * 0.05); }
      ctx.stroke();
    }

    // Poderes
    if (g.power === 'lineH' || g.power === 'lineV') {
      ctx.fillStyle = 'rgba(255,255,255,.85)';
      const w = half * 0.85, t = half * 0.16;
      ctx.save(); ctx.translate(cx, cy); if (g.power === 'lineV') ctx.rotate(Math.PI / 2);
      ctx.fillRect(-w, -t * 1.6, w * 2, t); ctx.fillRect(-w, t * 0.6, w * 2, t);
      ctx.restore();
    } else if (g.power === 'bomba') {
      ctx.fillStyle = 'rgba(2,6,15,.55)';
      ctx.beginPath(); ctx.arc(cx, cy, half * 0.5, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#fde68a'; ctx.lineWidth = Math.max(1.5, cell * 0.035);
      ctx.beginPath(); ctx.arc(cx, cy, half * 0.5, 0, Math.PI * 2); ctx.stroke();
    } else if (esEstrella) {
      estrella4(cx, cy, half * 0.75, half * 0.28);
    } else if (g.power === 'cometa') {
      ctx.fillStyle = 'rgba(255,255,255,.92)';
      ctx.beginPath(); ctx.arc(cx, cy, half * 0.26, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = Math.max(1.5, cell * 0.03);
      for (let k = 0; k < 4; k++) {
        const ang = Math.PI / 4 + k * Math.PI / 2;
        ctx.beginPath(); ctx.moveTo(cx, cy);
        ctx.lineTo(cx + Math.cos(ang) * half * 0.85, cy + Math.sin(ang) * half * 0.85); ctx.stroke();
      }
    }

    // Pips de HP (diamantes duros)
    if (g.hpMax > 1) {
      const px = cx + half * 0.62, py = cy - half * 0.62, r = Math.max(1.5, cell * 0.035);
      for (let k = 0; k < g.hp; k++) {
        ctx.fillStyle = '#fde68a';
        ctx.beginPath(); ctx.arc(px - k * r * 2.6, py, r, 0, Math.PI * 2); ctx.fill();
      }
    }

    // Anillo de objetivo
    if (g.objetivo) {
      ctx.strokeStyle = 'rgba(252,211,77,.9)'; ctx.lineWidth = Math.max(1.5, cell * 0.03);
      ctx.setLineDash([cell * 0.12, cell * 0.08]);
      ctx.beginPath(); ctx.arc(cx, cy, half * 1.05, 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([]);
    }
  }

  function estrella4(cx, cy, R, r) {
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    for (let i = 0; i < 8; i++) {
      const ang = (Math.PI / 4) * i - Math.PI / 2;
      const rad = i % 2 === 0 ? R : r;
      const x = cx + Math.cos(ang) * rad, y = cy + Math.sin(ang) * rad;
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.closePath(); ctx.fill();
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  /* ===================== Generación ===================== */
  function generarNivel() {
    const C = def.colores, rng = def.rng;
    do {
      grid = [];
      for (let r = 0; r < N; r++) {
        const fila = [];
        for (let c = 0; c < N; c++) {
          let t;
          do { t = (rng() * C) | 0; }
          while ((c >= 2 && fila[c - 1].tipo === t && fila[c - 2].tipo === t) ||
                 (r >= 2 && grid[r - 1][c].tipo === t && grid[r - 2][c].tipo === t));
          fila.push(gem(r, c, t));
        }
        grid.push(fila);
      }
    } while (tieneMatches() || !hayMovimientos());

    // Diamantes duros
    let n = def.duros, guard = 0;
    while (n > 0 && guard++ < 800) {
      const r = (rng() * N) | 0, c = (rng() * N) | 0, g = grid[r][c];
      if (g.hpMax === 1 && !g.power) {
        const hp = def.reforzados && rng() < 0.45 ? 3 : 2;
        g.hp = hp; g.hpMax = hp;
        if (def.tipo === 'romper') g.objetivo = true;
        n--;
      }
    }
  }

  function contarObjetivos() {
    let n = 0;
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (grid[r][c] && grid[r][c].objetivo) n++;
    return n;
  }

  /* ===================== Matching ===================== */
  function tieneMatches() {
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      const g = grid[r][c]; if (!g || g.tipo < 0) continue; const t = g.tipo;
      if (c >= 2 && grid[r][c - 1].tipo === t && grid[r][c - 2].tipo === t) return true;
      if (r >= 2 && grid[r - 1][c].tipo === t && grid[r - 2][c].tipo === t) return true;
    }
    return false;
  }

  function tieneCuadro() {
    for (let r = 0; r < N - 1; r++) for (let c = 0; c < N - 1; c++) {
      const g = grid[r][c]; if (!g || g.tipo < 0) continue; const t = g.tipo;
      if (grid[r][c + 1].tipo === t && grid[r + 1][c].tipo === t && grid[r + 1][c + 1].tipo === t) return true;
    }
    return false;
  }

  function hayMovimientos() {
    const test = (r1, c1, r2, c2) => {
      const a = grid[r1][c1].tipo, b = grid[r2][c2].tipo;
      // poderes garantizan jugada
      if (grid[r1][c1].power || grid[r2][c2].power) return true;
      grid[r1][c1].tipo = b; grid[r2][c2].tipo = a;
      const hay = tieneMatches() || tieneCuadro();
      grid[r1][c1].tipo = a; grid[r2][c2].tipo = b;
      return hay;
    };
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      if (c < N - 1 && test(r, c, r, c + 1)) return true;
      if (r < N - 1 && test(r, c, r + 1, c)) return true;
    }
    return false;
  }

  // Busca runs >=3 y decide creación de poderes. Devuelve {clear:Set, creations:[{idx,power}]}
  function buscarGrupos(swap) {
    const runsH = [], runsV = [];
    for (let r = 0; r < N; r++) {
      let s = 0;
      for (let c = 1; c <= N; c++) {
        const same = c < N && grid[r][c] && grid[r][c - 1] && grid[r][c].tipo === grid[r][c - 1].tipo && grid[r][c].tipo >= 0;
        if (same) continue;
        const len = c - s;
        if (len >= 3) { const cells = []; for (let k = s; k < c; k++) cells.push(I(r, k)); runsH.push({ cells, len, dir: 'H' }); }
        s = c;
      }
    }
    for (let c = 0; c < N; c++) {
      let s = 0;
      for (let r = 1; r <= N; r++) {
        const same = r < N && grid[r][c] && grid[r - 1][c] && grid[r][c].tipo === grid[r - 1][c].tipo && grid[r][c].tipo >= 0;
        if (same) continue;
        const len = r - s;
        if (len >= 3) { const cells = []; for (let k = s; k < r; k++) cells.push(I(k, c)); runsV.push({ cells, len, dir: 'V' }); }
        s = r;
      }
    }

    const clear = new Set();
    runsH.forEach(rn => rn.cells.forEach(i => clear.add(i)));
    runsV.forEach(rn => rn.cells.forEach(i => clear.add(i)));

    const swapIdx = new Set();
    if (swap) { swapIdx.add(I(swap.a.r, swap.a.c)); swapIdx.add(I(swap.b.r, swap.b.c)); }
    const pickPivot = cells => { for (const i of cells) if (swapIdx.has(i)) return i; return cells[cells.length >> 1]; };

    // Cuadros 2×2 del mismo color que NO estén dentro de un run lineal.
    const cuadros = [];
    for (let r = 0; r < N - 1; r++) for (let c = 0; c < N - 1; c++) {
      const g = grid[r][c]; if (!g || g.tipo < 0) continue; const t = g.tipo;
      if (grid[r][c + 1].tipo === t && grid[r + 1][c].tipo === t && grid[r + 1][c + 1].tipo === t) {
        const sq = [I(r, c), I(r, c + 1), I(r + 1, c), I(r + 1, c + 1)];
        if (!sq.some(i => clear.has(i))) cuadros.push(sq);
      }
    }
    if (clear.size === 0 && cuadros.length === 0) return { clear, creations: [] };

    const inH = new Set(), inV = new Set();
    runsH.forEach(rn => rn.cells.forEach(i => inH.add(i)));
    runsV.forEach(rn => rn.cells.forEach(i => inV.add(i)));

    const creations = [], usados = new Set();
    // Bombas: intersección de run H y run V (forma L/T/+)
    for (const i of clear) {
      if (inH.has(i) && inV.has(i) && !usados.has(i)) { creations.push({ idx: i, power: 'bomba' }); usados.add(i); }
    }
    // Estrella: run recto de 5+
    [...runsH, ...runsV].forEach(rn => {
      if (rn.len >= 5 && !rn.cells.some(i => usados.has(i))) {
        const p = pickPivot(rn.cells); creations.push({ idx: p, power: 'estrella' }); usados.add(p);
      }
    });
    // Línea (rayo): run recto de 4
    [...runsH, ...runsV].forEach(rn => {
      if (rn.len === 4 && !rn.cells.some(i => usados.has(i))) {
        const p = pickPivot(rn.cells); creations.push({ idx: p, power: rn.dir === 'H' ? 'lineH' : 'lineV' }); usados.add(p);
      }
    });
    // Cometa: cuadrado 2×2
    cuadros.forEach(sq => {
      sq.forEach(i => clear.add(i));
      if (!sq.some(i => usados.has(i))) {
        const p = sq.find(i => swapIdx.has(i)); const piv = p != null ? p : sq[0];
        creations.push({ idx: piv, power: 'cometa' }); usados.add(piv);
      }
    });

    creations.forEach(cr => clear.delete(cr.idx)); // los pivotes se transforman, no se eliminan
    return { clear, creations };
  }

  // Cobertura de un poder al detonar.
  function blast(i, g) {
    const r = (i / N) | 0, c = i % N, out = [];
    if (g.power === 'lineH') { for (let cc = 0; cc < N; cc++) out.push(I(r, cc)); }
    else if (g.power === 'lineV') { for (let rr = 0; rr < N; rr++) out.push(I(rr, c)); }
    else if (g.power === 'bomba') {
      for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
        const rr = r + dr, cc = c + dc; if (rr >= 0 && rr < N && cc >= 0 && cc < N) out.push(I(rr, cc));
      }
    } else if (g.power === 'estrella') {
      const col = g.objColor != null ? g.objColor : g.tipo;
      for (let rr = 0; rr < N; rr++) for (let cc = 0; cc < N; cc++) { const x = grid[rr][cc]; if (x && x.tipo === col) out.push(I(rr, cc)); }
    } else if (g.power === 'cometa') {
      // Dispara a 3 celdas: prioriza objetivos; si no, gemas al azar. Cada
      // impacto salpica a sus vecinos ortogonales.
      const objs = [], pool = [];
      for (let rr = 0; rr < N; rr++) for (let cc = 0; cc < N; cc++) {
        const x = grid[rr][cc]; if (!x || x.tipo < 0) continue;
        if (rr === r && cc === c) continue;
        (x.objetivo ? objs : pool).push(I(rr, cc));
      }
      const fuente = objs.length ? objs.concat(pool) : pool;
      const arr = fuente.slice(), picks = [];
      for (let k = 0; k < 3 && arr.length; k++) picks.push(arr.splice((Math.random() * arr.length) | 0, 1)[0]);
      out.push(i);
      picks.forEach(p => {
        out.push(p); const pr = (p / N) | 0, pc = p % N;
        [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(([dr, dc]) => {
          const rr = pr + dr, cc = pc + dc; if (rr >= 0 && rr < N && cc >= 0 && cc < N) out.push(I(rr, cc));
        });
      });
    }
    return out;
  }

  // Color del haz según el poder.
  const COLOR_HAZ = { lineH: '#a5f3fc', lineV: '#a5f3fc', bomba: '#fde68a', estrella: '#ffffff', cometa: '#bae6fd' };

  // Encola los haces/ondas que dibuja un poder al activarse en (r,c).
  function encolarHaces(i, g, cubiertas) {
    const r = (i / N) | 0, c = i % N, col = COLOR_HAZ[g.power] || '#ffffff';
    if (g.power === 'lineH') { fxBeams.push({ k: 'beam', r0: r, c0: c, r1: r, c1: 0, col }); fxBeams.push({ k: 'beam', r0: r, c0: c, r1: r, c1: N - 1, col }); }
    else if (g.power === 'lineV') { fxBeams.push({ k: 'beam', r0: r, c0: c, r1: 0, c1: c, col }); fxBeams.push({ k: 'beam', r0: r, c0: c, r1: N - 1, c1: c, col }); }
    else if (g.power === 'bomba') { fxBeams.push({ k: 'ring', r, c, col }); }
    else { // estrella / cometa: un haz a cada celda afectada
      let n = 0;
      for (const t of cubiertas) { if (t === i || n++ > 30) continue; fxBeams.push({ k: 'beam', r0: r, c0: c, r1: (t / N) | 0, c1: t % N, col }); }
    }
  }

  // Expande un conjunto inicial activando poderes en cadena.
  function recolectarDetonacion(initial, protect) {
    const out = new Set(), stack = [...initial], act = new Set();
    while (stack.length) {
      const i = stack.pop();
      if (protect && protect.has(i)) continue;
      const g = at(i); if (!g || g.tipo < 0) { out.add(i); continue; }
      out.add(i);
      if (g.power && !act.has(i)) {
        act.add(i);
        const b = blast(i, g);
        encolarHaces(i, g, b);
        for (const x of b) if (!out.has(x)) stack.push(x);
      }
    }
    return out;
  }

  /* ===================== Resolución ===================== */
  async function aplicarDetonacion(deton, combo, creations) {
    creations.forEach(cr => { const g = at(cr.idx); if (g) { g.power = cr.power; g.hp = 1; g.hpMax = 1; } });
    const pivotSet = new Set(creations.map(c => c.idx));

    const removidos = [], danados = []; let objHit = 0;
    deton.forEach(i => {
      const g = at(i); if (!g) return;
      if (pivotSet.has(i)) return;
      if (g.hp > 1) { g.hp--; danados.push(g); return; }
      removidos.push(i); if (g.objetivo) objHit++;
    });

    score += removidos.length * PT_GEMA * combo + creations.length * 30;
    if (combo >= 2 && removidos.length) mostrarCombo(combo);
    actualizarHUD();
    beep(500 + combo * 70, 0.12, 0.3);
    vibrar(combo > 1 ? [20, 20, 30] : 35);

    // Haces/ondas de los poderes que fluyen sobre el área afectada
    if (fxBeams.length) {
      fxBeams.forEach(b => { if (b.k === 'beam') spawnHaz(b.r0, b.c0, b.r1, b.c1, b.col); else spawnOnda(b.r, b.c, cell * 1.7, b.col); });
      fxBeams = [];
    }

    // 1) Luz palpitante de carga en las gemas por estallar
    removidos.forEach(i => { const g = at(i); if (g) g.charge = 1; });
    if (removidos.length) await espera(150);

    // 2) Estallido en pedazos
    const anims = [];
    removidos.forEach(i => {
      const g = at(i); if (!g) return;
      const cx = (g.dc + 0.5) * cell, cy = (g.dr + 0.5) * cell;
      const [k1, k2] = g.power ? ['#ffffff', '#bae6fd'] : COLORES[g.tipo];
      spawnEsquirlas(cx, cy, k1, k2);
      anims.push(tween(g, { scale: 0, charge: 0 }, 130, easeInQuad));
    });
    danados.forEach(g => { g.scale = 1; anims.push(tween(g, { scale: 0.62 }, 80, easeOutQuad).then(() => tween(g, { scale: 1 }, 150, easeOutBack))); });
    await Promise.all(anims);

    removidos.forEach(i => { grid[(i / N) | 0][i % N] = null; });
    objRestante -= objHit;
    actualizarHUD();
  }

  const espera = ms => new Promise(res => setTimeout(res, ms));

  async function waveNatural(swap, combo) {
    const { clear, creations } = buscarGrupos(swap);
    if (clear.size === 0 && creations.length === 0) return false;
    const protect = new Set(creations.map(c => c.idx));
    const deton = recolectarDetonacion(clear, protect);
    await aplicarDetonacion(deton, combo, creations);
    return true;
  }

  async function waveExplicita(initial, combo) {
    const deton = recolectarDetonacion(initial, null);
    if (deton.size === 0) return false;
    await aplicarDetonacion(deton, combo, []);
    return true;
  }

  // Efecto de intercambiar uno o dos poderes (combos).
  function efectoSwap(a, b) {
    const ia = I(a.r, a.c), ib = I(b.r, b.c);
    const ga = at(ia), gb = at(ib);
    const set = new Set([ia, ib]);
    const pa = ga && ga.power, pb = gb && gb.power;
    const add = i => { if (i >= 0 && i < N * N) set.add(i); };
    const fila = r => { if (r < 0 || r >= N) return; for (let c = 0; c < N; c++) add(I(r, c)); };
    const col = c => { if (c < 0 || c >= N) return; for (let r = 0; r < N; r++) add(I(r, c)); };
    const area = (r, c, rad) => { for (let dr = -rad; dr <= rad; dr++) for (let dc = -rad; dc <= rad; dc++) { const rr = r + dr, cc = c + dc; if (rr >= 0 && rr < N && cc >= 0 && cc < N) add(I(rr, cc)); } };
    const color = col0 => { for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) { const g = grid[r][c]; if (g && g.tipo === col0) add(I(r, c)); } };

    const eachColor = (col0, fn) => { for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) { const g = grid[r][c]; if (g && g.tipo === col0) fn(r, c); } };
    const shots = (cnt, fn) => {
      const pool = []; for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) { const g = grid[r][c]; if (g && g.tipo >= 0) pool.push([r, c]); }
      for (let k = 0; k < cnt && pool.length; k++) { const [r, c] = pool.splice((Math.random() * pool.length) | 0, 1)[0]; fn(r, c); }
    };

    if (pa && pb) {
      const has = p => pa === p || pb === p;
      if (has('estrella') && pa === pb) {
        for (let i = 0; i < N * N; i++) add(i);                              // estrella + estrella = todo el tablero
      } else if (has('estrella')) {
        const otro = pa === 'estrella' ? gb : ga, col0 = otro.tipo;
        if (otro.power === 'bomba') eachColor(col0, (r, c) => area(r, c, 1)); // estrella + bomba = cada gema del color explota 3×3
        else if (otro.power === 'cometa') { color(col0); shots(6, (r, c) => area(r, c, 1)); } // estrella + cometa = borra el color + 6 disparos
        else { eachColor(col0, (r, c) => { fila(r); col(c); }); color(col0); } // estrella + rayo = cada gema del color = cruz
      } else if (has('cometa') && pa === pb) {
        shots(6, (r, c) => area(r, c, 1));                                    // cometa + cometa = 6 estallidos
      } else if (has('cometa')) {
        const otro = pa === 'cometa' ? gb : ga;
        if (otro.power === 'bomba') shots(3, (r, c) => area(r, c, 1));        // cometa + bomba = 3 estallidos 3×3
        else shots(3, (r, c) => { fila(r); col(c); });                       // cometa + rayo = 3 cruces
      } else if (pa === 'bomba' && pb === 'bomba') {
        area(a.r, a.c, 2); area(b.r, b.c, 2);                                // bomba + bomba = 5×5
      } else if (has('bomba')) {
        for (let d = -1; d <= 1; d++) { fila(a.r + d); col(a.c + d); }       // rayo + bomba = banda (3 filas + 3 col)
      } else {
        fila(a.r); col(a.c);                                                 // rayo + rayo = cruz
      }
    } else {
      const pcell = pa ? ia : ib, pg = at(pcell), otro = pa ? gb : ga;
      if (pg.power === 'estrella') pg.objColor = otro ? otro.tipo : pg.tipo;  // estrella + normal = ese color
      // rayo/bomba/cometa + normal: la detonación expande desde pcell
    }
    return set;
  }

  /* ===================== Caída (gravedad con diagonal) ===================== */
  // Asienta el tablero: primero gravedad recta + relleno desde arriba; cuando ya
  // nada puede bajar recto, un diamante que tiene su casilla de abajo ocupada
  // baja en diagonal a un hueco contiguo (prioridad al azar izquierda/derecha).
  // `refill` rellena los huecos superiores con gemas nuevas. `fixed` es un Set de
  // gemas que NO se mueven (diamantes especiales durante la recuperación).
  async function colapsar(opts) {
    const refill = !opts || opts.refill !== false;
    const fixed = (opts && opts.fixed) || null;
    const movible = g => g && !(fixed && fixed.has(g));

    let cambio = true;
    while (cambio) {
      cambio = false;

      // 1) Gravedad recta + relleno, hasta asentar.
      let recto = true;
      while (recto) {
        recto = false;
        const tw = [];
        for (let r = N - 2; r >= 0; r--) for (let c = 0; c < N; c++) {
          const g = grid[r][c];
          if (movible(g) && !grid[r + 1][c]) {
            grid[r + 1][c] = g; grid[r][c] = null;
            tw.push(tween(g, { dr: r + 1 }, 90)); recto = true; cambio = true;
          }
        }
        if (refill) for (let c = 0; c < N; c++) {
          if (!grid[0][c]) {
            const g = gem(0, c, (Math.random() * def.colores) | 0);
            g.dr = -1; grid[0][c] = g;
            tw.push(tween(g, { dr: 0 }, 110)); recto = true; cambio = true;
          }
        }
        if (tw.length) await Promise.all(tw);
      }

      // 2) Un paso diagonal donde la casilla de abajo está bloqueada.
      const td = [];
      for (let r = N - 2; r >= 0; r--) for (let c = 0; c < N; c++) {
        const g = grid[r][c];
        if (!movible(g) || !grid[r + 1][c]) continue;   // libre abajo => lo maneja la recta
        const ops = [];
        if (c > 0 && !grid[r + 1][c - 1]) ops.push(c - 1);
        if (c < N - 1 && !grid[r + 1][c + 1]) ops.push(c + 1);
        if (!ops.length) continue;
        const nc = ops[(Math.random() * ops.length) | 0];  // prioridad al azar izq/der
        grid[r + 1][nc] = g; grid[r][c] = null;
        td.push(tween(g, { dr: r + 1, dc: nc }, 120)); cambio = true;
      }
      if (td.length) await Promise.all(td);
    }
  }

  // Sin movimientos posibles: estallan los diamantes estándar; los especiales
  // mantienen su posición. Se rellena por gravedad (con diagonal) alrededor de
  // ellos y se resuelven las cascadas. Se repite hasta que vuelva a haber jugada.
  async function recuperar() {
    estado = 'busy';
    let guard = 0;
    while (!hayMovimientos() && guard++ < 30) {
      const rem = [];
      for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
        const g = grid[r][c];
        if (g && g.tipo >= 0 && !g.power) rem.push(g);
      }
      if (!rem.length) break;                  // solo quedan especiales: nada que hacer
      rem.forEach(g => { g.charge = 1; });
      await espera(140);
      const anims = [];
      rem.forEach(g => {
        const cx = (g.dc + 0.5) * cell, cy = (g.dr + 0.5) * cell;
        spawnEsquirlas(cx, cy, ...COLORES[g.tipo]);
        anims.push(tween(g, { scale: 0, charge: 0 }, 130, easeInQuad));
      });
      await Promise.all(anims);
      for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (rem.includes(grid[r][c])) grid[r][c] = null;

      const fixed = new Set();
      for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (grid[r][c] && grid[r][c].power) fixed.add(grid[r][c]);
      await colapsar({ refill: true, fixed });

      // Caso especial (p. ej. 3 especiales en fila que dejan un hueco bajo un
      // especial): tras el rellenado, dejar caer TODO normalmente para que esos
      // especiales se asienten en los huecos que les queden debajo.
      await colapsar();

      // Las gemas nuevas pueden formar combinaciones: resolverlas.
      let combo = 1;
      while (await waveNatural(null, combo)) { await colapsar(); combo++; }
    }
  }

  /* ===================== Interacción ===================== */
  function celdaDesdeEvento(e) {
    const rect = cv.getBoundingClientRect();
    const c = Math.floor((e.clientX - rect.left) / rect.width * N);
    const r = Math.floor((e.clientY - rect.top) / rect.height * N);
    if (r < 0 || r >= N || c < 0 || c >= N) return null;
    return { r, c };
  }
  const adyacentes = (a, b) => Math.abs(a.r - b.r) + Math.abs(a.c - b.c) === 1;

  let downCell = null;
  cv.addEventListener('pointerdown', e => {
    if (estado !== 'idle') return;
    e.preventDefault();
    downCell = celdaDesdeEvento(e);
    if (!downCell) return;
    if (sel && adyacentes(sel, downCell)) { const a = sel; sel = null; intentarSwap(a, downCell); }
    else sel = downCell;
  });
  cv.addEventListener('pointermove', e => {
    if (estado !== 'idle' || !downCell) return;
    const cur = celdaDesdeEvento(e);
    if (cur && adyacentes(downCell, cur)) { const a = downCell; downCell = null; sel = null; intentarSwap(a, cur); }
  });
  cv.addEventListener('pointerup', () => { downCell = null; });
  cv.addEventListener('pointercancel', () => { downCell = null; });

  function animarSwap(a, b) {
    const ga = grid[a.r][a.c], gb = grid[b.r][b.c];
    return Promise.all([tween(ga, { dr: b.r, dc: b.c }, 140), tween(gb, { dr: a.r, dc: a.c }, 140)]);
  }
  function intercambiar(a, b) {
    const t = grid[a.r][a.c]; grid[a.r][a.c] = grid[b.r][b.c]; grid[b.r][b.c] = t;
    const ga = grid[a.r][a.c], gb = grid[b.r][b.c];
    ga.dr = a.r; ga.dc = a.c; gb.dr = b.r; gb.dc = b.c;
  }

  async function intentarSwap(a, b) {
    estado = 'busy'; beep(440, 0.05, 0.15);
    await animarSwap(a, b); intercambiar(a, b);
    const ga = grid[a.r][a.c], gb = grid[b.r][b.c];
    const hayPoder = (ga && ga.power) || (gb && gb.power);
    const grupos = buscarGrupos({ a, b });
    if (grupos.clear.size === 0 && grupos.creations.length === 0 && !hayPoder) {
      await animarSwap(a, b); intercambiar(a, b); vibrar(30); estado = 'idle'; return;
    }
    movs--; actualizarHUD();

    if (hayPoder) {
      const set = efectoSwap(a, b);
      await waveExplicita(set, 1);
      await colapsar();
      let combo = 2;
      while (await waveNatural(null, combo)) { await colapsar(); combo++; }
    } else {
      let combo = 1, swap = { a, b };
      while (await waveNatural(swap, combo)) { swap = null; await colapsar(); combo++; }
    }

    if (chequear() === null && !hayMovimientos()) await recuperar();
    estado = 'idle';
    finalizarSiCorresponde();
  }

  /* ===================== Niveles ===================== */
  function chequear() {
    if (endless) return null;   // en modo libre el nivel nunca termina
    if (def.tipo === 'puntos' && score >= def.objetivoPuntos) return 'win';
    if (def.tipo === 'romper' && objRestante <= 0) return 'win';
    if (movs <= 0) return 'lose';
    return null;
  }

  function estrellas() {
    if (def.tipo === 'puntos') { const r = score / def.objetivoPuntos; return r >= 1.6 ? 3 : r >= 1.2 ? 2 : 1; }
    const r = movs / def.movs; return r >= 0.5 ? 3 : r >= 0.25 ? 2 : 1;
  }

  function iniciarNivel(n) {
    if (!desbloqueado(n)) { beep(300, 0.18, 0.3); return; }
    def = defNivel(n);
    score = 0; movs = def.movs; sel = null; estado = 'idle'; endless = false;
    generarNivel();
    objRestante = contarObjetivos();
    mostrarVista('juego');
    medir();
    actualizarHUD();
  }

  // Continúa el tablero actual sin límite de movimientos (modo libre).
  async function entrarEndless() {
    $('modalFin').classList.remove('abierto');
    endless = true;
    movs = Infinity;
    estado = 'idle';
    actualizarHUD();
    if (!hayMovimientos()) await recuperar();
    estado = 'idle';
  }

  function nivelCompletado() {
    const e = estrellas();
    prog.stars[def.n] = Math.max(prog.stars[def.n] || 0, e);
    prog.max = Math.max(prog.max, def.n + 1);
    guardarProg();
    $('finTitulo').textContent = '¡Nivel superado!';
    pintarEstrellas(e);
    $('finMsg').textContent = def.tipo === 'puntos' ? ('Puntos: ' + score) : ('Movimientos restantes: ' + Math.max(0, movs));
    $('btnSiguiente').style.display = ''; $('btnReintentar').style.display = 'none';
    $('btnEndless').style.display = '';
    $('modalFin').classList.add('abierto');
    avisoFin();
  }
  function nivelFallado() {
    $('finTitulo').textContent = 'Sin movimientos';
    pintarEstrellas(0);
    $('finMsg').textContent = def.tipo === 'puntos'
      ? ('Te faltaron ' + Math.max(0, def.objetivoPuntos - score) + ' puntos')
      : ('Quedaban ' + Math.max(0, objRestante) + ' diamantes');
    $('btnSiguiente').style.display = 'none'; $('btnReintentar').style.display = '';
    $('btnEndless').style.display = '';
    $('modalFin').classList.add('abierto');
    beep(300, 0.25, 0.35);
  }
  function finalizarSiCorresponde() {
    const r = chequear();
    if (r === 'win') nivelCompletado();
    else if (r === 'lose') nivelFallado();
  }

  function pintarEstrellas(e) {
    let h = '';
    for (let i = 0; i < 3; i++) h += '<span class="' + (i < e ? 'on' : 'off') + '">★</span>';
    $('finEstrellas').innerHTML = h;
  }

  /* ===================== Mapa ===================== */
  function mostrarVista(v) {
    vista = v;
    $('vistaMapa').classList.toggle('activa', v === 'mapa');
    $('vistaJuego').classList.toggle('activa', v === 'juego');
    $('btnMapaTop').style.display = v === 'juego' ? '' : 'none';
    $('btnGlosario').style.display = v === 'mapa' ? '' : 'none';
  }

  function irAlMapa() { $('modalFin').classList.remove('abierto'); mostrarVista('mapa'); renderMapa(); }

  // --- Mapa navegable (pan) ---
  const SVGNS = 'http://www.w3.org/2000/svg';
  let mapOff = { x: 0, y: 0 };
  let mapDim = { w: 0, h: 0, vw: 0, vh: 0 };
  let mapStops = [];
  let mapActualXY = null;
  let mapPanInit = false;

  function renderMapa() {
    const vp = $('mapaVp'), lienzo = $('mapaMundo'), svg = $('mapaSvg');
    mapDim.vw = vp.clientWidth || window.innerWidth;
    mapDim.vh = vp.clientHeight || (window.innerHeight - 120);
    const centerX = Math.max(mapDim.vw, 320) / 2;
    const amp = Math.min(centerX - 60, 120);

    Array.from(lienzo.querySelectorAll('.nivel-nodo,.portal')).forEach(e => e.remove());
    mapStops = [];

    const tot = estrellasTotales();
    const maxW = mundoDeNivel(prog.max) + 1;

    for (let w = 1; w <= maxW; w++) {
      if (w > 1) {
        const rm = reqMundo(w);
        mapStops.push({ type: 'portal', w, abierto: tot >= rm, req: rm, tot });
      }
      for (let k = 1; k <= NIVELES_POR_MUNDO; k++) {
        const n = (w - 1) * NIVELES_POR_MUNDO + k;
        const req = reqNivel(n);
        const unlocked = n <= prog.max && tot >= req;
        mapStops.push({ type: 'level', w, k, n, req, unlocked, esActual: n === prog.max });
      }
    }

    // Camino siempre ASCENDENTE: el nivel 1 (o=0) queda abajo y cada parada
    // siguiente sube. La X serpentea según el orden real.
    const lastO = mapStops.length - 1;
    mapStops.forEach((s, o) => {
      s.x = centerX + amp * Math.sin(o * 0.7);
      s.y = 90 + (lastO - o) * 118;
    });
    mapDim.w = Math.max(mapDim.vw, 320);
    mapDim.h = (lastO >= 0 ? 90 + lastO * 118 : 0) + 140;
    lienzo.style.width = mapDim.w + 'px';
    lienzo.style.height = mapDim.h + 'px';

    svg.setAttribute('width', mapDim.w);
    svg.setAttribute('height', mapDim.h);
    svg.innerHTML = '';
    for (let i = 1; i < mapStops.length; i++) {
      const a = mapStops[i - 1], b = mapStops[i];
      const d = 'M ' + a.x + ' ' + a.y + ' C ' + a.x + ' ' + ((a.y + b.y) / 2) + ', ' + b.x + ' ' + ((a.y + b.y) / 2) + ', ' + b.x + ' ' + b.y;
      const tint = infoMundo(b.w).tint;
      const seg = document.createElementNS(SVGNS, 'path');
      seg.setAttribute('d', d);
      seg.setAttribute('fill', 'none');
      const on = (b.type === 'level' ? b.unlocked : b.abierto);
      seg.setAttribute('stroke', on ? tint : 'rgba(148,163,184,.25)');
      seg.setAttribute('stroke-width', on ? '7' : '5');
      seg.setAttribute('stroke-linecap', 'round');
      seg.setAttribute('stroke-dasharray', on ? 'none' : '2 12');
      seg.setAttribute('opacity', on ? '0.55' : '0.5');
      svg.appendChild(seg);
    }

    mapActualXY = null;
    mapStops.forEach(s => {
      const tint = infoMundo(s.w).tint;
      if (s.type === 'portal') {
        const el = document.createElement('button');
        el.className = 'portal' + (s.abierto ? '' : ' bloq');
        el.style.setProperty('--tint', tint);
        el.style.left = s.x + 'px'; el.style.top = s.y + 'px';
        const info = infoMundo(s.w);
        if (s.abierto) {
          el.innerHTML = '<span class="pn">Portal</span><span class="pw">' + info.nombre + '</span>';
          el._accion = () => iniciarNivel((s.w - 1) * NIVELES_POR_MUNDO + 1);
        } else {
          el.innerHTML = '<span class="pn">Portal</span><span class="plock">🔒 ★' + s.tot + '/' + s.req + '</span>';
        }
        lienzo.appendChild(el);
      } else {
        const stars = prog.stars[s.n] || 0;
        const el = document.createElement('button');
        el.className = 'nivel-nodo' + (s.unlocked ? '' : ' bloq') + (s.esActual && s.unlocked ? ' actual' : '');
        el.style.setProperty('--tint', tint);
        el.style.left = s.x + 'px'; el.style.top = s.y + 'px';
        if (s.unlocked) {
          el.innerHTML = '<span class="nn">' + s.k + '</span><span class="ne">' + '★'.repeat(stars) + '☆'.repeat(3 - stars) + '</span>';
          el._accion = () => iniciarNivel(s.n);
        } else if (s.n <= prog.max) {
          el.innerHTML = '<span class="nn">🔒</span><span class="ne">★ ' + tot + '/' + s.req + '</span>';
        } else {
          el.innerHTML = '🔒';
        }
        lienzo.appendChild(el);
        if (s.esActual) mapActualXY = { x: s.x, y: s.y };
      }
    });

    if (!mapActualXY && mapStops.length) mapActualXY = { x: mapStops[0].x, y: mapStops[0].y };

    initMapaPan();
    centrarEn(mapActualXY, false);
    actualizarMapaHud();
  }

  // ---- Pan ----
  let panStart = null, panBase = null, panMoved = false;
  const panHaArrastrado = () => panMoved;

  function clampOff() {
    const minX = Math.min(0, mapDim.vw - mapDim.w), maxX = 0;
    const minY = Math.min(0, mapDim.vh - mapDim.h), maxY = 0;
    if (mapDim.w <= mapDim.vw) mapOff.x = (mapDim.vw - mapDim.w) / 2;
    else mapOff.x = Math.max(minX, Math.min(maxX, mapOff.x));
    mapOff.y = Math.max(minY, Math.min(maxY, mapOff.y));
  }
  function aplicarPan() {
    clampOff();
    $('mapaMundo').style.transform = 'translate(' + mapOff.x + 'px,' + mapOff.y + 'px)';
  }
  function centrarEn(xy, suave) {
    if (!xy) return;
    mapOff.x = mapDim.vw / 2 - xy.x;
    mapOff.y = mapDim.vh / 2 - xy.y;
    const lienzo = $('mapaMundo');
    lienzo.style.transition = suave ? 'transform .35s ease' : 'none';
    aplicarPan();
    if (suave) setTimeout(() => { lienzo.style.transition = 'none'; }, 360);
  }
  function actualizarMapaHud() {
    const cy = -mapOff.y + mapDim.vh / 2;
    let best = mapStops[0], bd = Infinity;
    for (const s of mapStops) { const d = Math.abs(s.y - cy); if (d < bd) { bd = d; best = s; } }
    if (!best) return;
    const info = infoMundo(best.w), tot = estrellasTotales();
    const hud = $('mapaHud');
    hud.style.setProperty('--tint', info.tint);
    hud.innerHTML =
      '<div><div class="mh-num">Mundo ' + best.w + '</div>' +
      '<div class="mh-nombre">' + info.nombre + '</div>' +
      '<div class="mh-feat">' + info.feat + '</div></div>' +
      '<div class="mh-stars">★ ' + tot + '</div>';
  }

  function initMapaPan() {
    if (mapPanInit) return;
    mapPanInit = true;
    const vp = $('mapaVp');
    vp.addEventListener('pointerdown', e => {
      panStart = { x: e.clientX, y: e.clientY };
      panBase = { x: mapOff.x, y: mapOff.y };
      panMoved = false;
      vp.classList.add('dragging');
      $('mapaMundo').style.transition = 'none';
      try { vp.setPointerCapture(e.pointerId); } catch (err) {}
    });
    vp.addEventListener('pointermove', e => {
      if (!panStart) return;
      const dx = e.clientX - panStart.x, dy = e.clientY - panStart.y;
      if (Math.abs(dx) + Math.abs(dy) > 7) {
        panMoved = true;
        const h = $('mapaHint'); if (h) h.style.opacity = '0';
      }
      mapOff.x = panBase.x + dx; mapOff.y = panBase.y + dy;
      aplicarPan();
      actualizarMapaHud();
    });
    const fin = e => {
      const fueTap = panStart && !panMoved;
      panStart = null; vp.classList.remove('dragging');
      if (fueTap && e && typeof e.clientX === 'number') {
        const t = document.elementFromPoint(e.clientX, e.clientY);
        const nodo = t && t.closest && t.closest('.nivel-nodo, .portal');
        if (nodo && nodo._accion) nodo._accion();
      }
    };
    vp.addEventListener('pointerup', fin);
    vp.addEventListener('pointercancel', () => { panStart = null; vp.classList.remove('dragging'); });
    $('mapaRecenter').addEventListener('click', () => centrarEn(mapActualXY, true));
  }

  /* ===================== Glosario / Guía ===================== */
  // Icono SVG de un diamante (con poder/dureza opcionales), estilo del juego.
  function svgGema(opts) {
    const o = opts || {};
    const col = o.col || ['#7dd3fc', '#0284c7'];
    const wide = o.wide;
    const W = wide ? 76 : 46, cells = wide ? [18, 58] : [23];
    const id = 'g' + Math.round(Math.random() * 1e6);
    let defs = '', body = '';
    cells.forEach((cx, i) => {
      const gid = id + '_' + i;
      const c = o.cols && o.cols[i] ? o.cols[i] : col;
      defs += `<linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c[0]}"/><stop offset="1" stop-color="${c[1]}"/></linearGradient>`;
      const cy = 23, h = 17;
      if (o.hard) {
        const tono = o.hard >= 3 ? '#57534e' : '#78716c';
        body += `<rect x="${cx - 19}" y="${cy - 19}" width="38" height="38" rx="7" fill="${tono}" stroke="rgba(0,0,0,.35)" stroke-width="1.5"/>`;
      }
      body += `<polygon points="${cx},${cy - h} ${cx + h},${cy} ${cx},${cy + h} ${cx - h},${cy}" fill="url(#${gid})" stroke="rgba(0,0,0,.2)" stroke-width="1.5"/>`;
      body += `<polygon points="${cx},${cy - h} ${cx + h * 0.35},${cy - h * 0.3} ${cx - h * 0.35},${cy - h * 0.3}" fill="rgba(255,255,255,.5)"/>`;
      const gl = (Array.isArray(o.glyph) ? o.glyph[i] : o.glyph);
      body += glifoPoder(gl, cx, cy, h);
      if (o.hard) for (let k = 0; k < o.hard; k++) body += `<circle cx="${cx + 11 - k * 5}" cy="${cy - 11}" r="2" fill="#fde68a"/>`;
    });
    return `<svg class="glos-ic${wide ? ' wide' : ''}" viewBox="0 0 ${W} 46" xmlns="http://www.w3.org/2000/svg"><defs>${defs}</defs>${body}</svg>`;
  }
  function glifoPoder(g, cx, cy, h) {
    if (g === 'rayoH') return `<rect x="${cx - h * 0.8}" y="${cy - h * 0.28}" width="${h * 1.6}" height="${h * 0.16}" fill="#fff"/><rect x="${cx - h * 0.8}" y="${cy + h * 0.12}" width="${h * 1.6}" height="${h * 0.16}" fill="#fff"/>`;
    if (g === 'rayoV') return `<rect x="${cx - h * 0.28}" y="${cy - h * 0.8}" width="${h * 0.16}" height="${h * 1.6}" fill="#fff"/><rect x="${cx + h * 0.12}" y="${cy - h * 0.8}" width="${h * 0.16}" height="${h * 1.6}" fill="#fff"/>`;
    if (g === 'bomba') return `<circle cx="${cx}" cy="${cy}" r="${h * 0.5}" fill="rgba(2,6,15,.55)" stroke="#fde68a" stroke-width="2"/>`;
    if (g === 'estrella') { let p = ''; for (let i = 0; i < 8; i++) { const a = Math.PI / 4 * i - Math.PI / 2; const r = i % 2 === 0 ? h * 0.75 : h * 0.28; p += (i ? 'L' : 'M') + (cx + Math.cos(a) * r) + ',' + (cy + Math.sin(a) * r); } return `<path d="${p}Z" fill="#fff"/>`; }
    if (g === 'cometa') { let s = `<circle cx="${cx}" cy="${cy}" r="${h * 0.24}" fill="#fff"/>`; for (let k = 0; k < 4; k++) { const a = Math.PI / 4 + k * Math.PI / 2; s += `<line x1="${cx}" y1="${cy}" x2="${cx + Math.cos(a) * h * 0.8}" y2="${cy + Math.sin(a) * h * 0.8}" stroke="#fff" stroke-width="2"/>`; } return s; }
    return '';
  }
  // Mini-diagrama del área afectada en una grilla pequeña.
  function svgGrid(cells, accent) {
    const n = 5, s = 9, pad = 2, W = n * s + pad * 2;
    let r = '';
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
      const on = cells.some(c => c[0] === x && c[1] === y);
      r += `<rect x="${pad + x * s}" y="${pad + y * s}" width="${s - 1.5}" height="${s - 1.5}" rx="1.5" fill="${on ? accent : 'rgba(148,163,184,.14)'}"/>`;
    }
    return `<svg class="glos-ic" viewBox="0 0 ${W} ${W}" xmlns="http://www.w3.org/2000/svg">${r}</svg>`;
  }
  const filaG = y => { const a = []; for (let x = 0; x < 5; x++) a.push([x, y]); return a; };
  const colG = x => { const a = []; for (let y = 0; y < 5; y++) a.push([x, y]); return a; };
  const cruzG = () => filaG(2).concat(colG(2));
  const areaG = (cx, cy, rad) => { const a = []; for (let y = 0; y < 5; y++) for (let x = 0; x < 5; x++) if (Math.abs(x - cx) <= rad && Math.abs(y - cy) <= rad) a.push([x, y]); return a; };
  const todoG = () => areaG(2, 2, 4);

  const PAL = COLORES;
  function item(ic, titulo, desc, how) {
    return '<div class="glos-item">' + ic + '<div class="glos-tx"><b>' + titulo + '</b><span>' + desc +
      (how ? ' <span class="how">' + how + '</span>' : '') + '</span></div></div>';
  }

  function construirGlosario() {
    const A = '#22d3ee';
    let h = '';

    h += '<div class="glos-sec"><h3>Cómo jugar</h3>';
    h += item(svgGema({ col: PAL[4] }), 'Combina', 'Toca una gema y una vecina (o desliza) para intercambiarlas.', 'Alinea 3 o más del mismo color para romperlas.');
    h += item(svgGrid([[0,2],[1,2],[2,2],[3,2]], A), 'Cascadas', 'Al caer pueden formarse nuevas líneas.', 'Cada reacción en cadena multiplica los puntos (¡combo!).');
    h += item(svgGema({ col: PAL[2], glyph: 'estrella' }), 'Objetivo del nivel', 'Meta de puntos, o romper todos los diamantes objetivo.', 'Lo ves arriba en el marcador.');
    h += '<div class="glos-item"><svg class="glos-ic" viewBox="0 0 46 46"><text x="23" y="32" font-size="30" text-anchor="middle">⭐</text></svg><div class="glos-tx"><b>Estrellas</b><span>1 a 3 según lo holgado que ganes. <span class="how">Abren mundos y portales en el mapa.</span></span></div></div>';
    h += '</div>';

    h += '<div class="glos-sec"><h3>Diamantes</h3>';
    h += item(svgGema({ col: PAL[0], hard: 2 }), 'Diamante duro', 'Necesita 2 golpes para romperse (muestra grietas).', 'Combínalo dos veces.');
    h += item(svgGema({ col: PAL[5], hard: 3 }), 'Diamante reforzado', 'Aguanta 3 golpes. Aparece en mundos avanzados.', '');
    h += '</div>';

    h += '<div class="glos-sec"><h3>Power-ups (se crean al combinar)</h3>';
    h += item(svgGema({ col: PAL[4], glyph: 'rayoH' }), 'Rayo', 'Se crea con 4 en línea.', 'Al activarlo limpia toda la fila o la columna.');
    h += item(svgGema({ col: PAL[3], glyph: 'bomba' }), 'Bomba', 'Se crea con una forma de L o T.', 'Estalla en un área de 3×3.');
    h += item(svgGema({ glyph: 'estrella', col: ['#f8fafc', '#cbd5e1'] }), 'Estrella', 'Se crea con 5 en línea.', 'Elimina todos los diamantes de un color.');
    h += item(svgGema({ col: PAL[1], glyph: 'cometa' }), 'Cometa', 'Se crea con un cuadrado 2×2.', 'Dispara a 3 celdas (prioriza objetivos) con salpicadura.');
    h += '<div class="glos-item" style="border:none"><svg class="glos-ic" viewBox="0 0 46 46"></svg><div class="glos-tx"><span>Para activar un power-up, intercámbialo con una gema vecina.</span></div></div>';
    h += '</div>';

    h += '<div class="glos-sec"><h3>Combinaciones (intercambia dos power-ups)</h3>';
    h += item(svgGrid(cruzG(), A), 'Rayo + Rayo', 'Cruz: limpia una fila y una columna completas.', '');
    h += item(svgGrid(filaG(1).concat(filaG(2),filaG(3),colG(1),colG(2),colG(3)), A), 'Rayo + Bomba', 'Banda: 3 filas y 3 columnas.', '');
    h += item(svgGrid(areaG(2,2,2), '#fde68a'), 'Bomba + Bomba', 'Explosión enorme de 5×5.', '');
    h += item(svgGrid([[1,1],[3,1],[2,3],[0,2],[4,2]], '#bae6fd'), 'Rayo/Bomba + Cometa', 'Varios disparos a zonas del tablero.', '');
    h += item(svgGrid([[0,0],[4,0],[2,2],[0,4],[4,4],[3,1]], '#bae6fd'), 'Cometa + Cometa', '6 estallidos repartidos.', '');
    h += item(svgGema({ wide: true, cols: [['#f8fafc','#cbd5e1'], PAL[3]], glyph: ['estrella','bomba'] }), 'Estrella + Rayo/Bomba', 'Convierte cada gema de un color en rayo o bomba.', '');
    h += item(svgGrid(todoG(), '#a5f3fc'), 'Estrella + Estrella', '¡Arrasa todo el tablero!', '');
    h += '</div>';

    $('glosBody').innerHTML = h;
  }
  let glosListo = false;
  function abrirGlosario() {
    if (!glosListo) { construirGlosario(); glosListo = true; }
    $('modalGlosario').classList.add('abierto');
  }

  /* ===================== HUD ===================== */
  function actualizarHUD() {
    $('hudNivel').textContent = def.w + '·' + def.em;
    $('moves').textContent = Math.max(0, movs);
    $('score').textContent = score;
    const ov = $('objVal');
    if (def.tipo === 'puntos') { $('objLbl').textContent = 'Meta'; ov.textContent = score + '/' + def.objetivoPuntos; ov.classList.remove('romper'); }
    else { $('objLbl').textContent = 'Romper'; ov.textContent = Math.max(0, objRestante) + ' 💎'; ov.classList.add('romper'); }
  }

  function mostrarCombo(n) {
    const el = $('combo');
    el.textContent = '¡Combo ×' + n + '!';
    el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
  }

  /* ===================== Audio ===================== */
  let actx = null;
  function beep(freq = 880, dur = 0.12, vol = 0.4) {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'triangle'; o.frequency.value = freq;
      g.gain.setValueAtTime(vol, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(); o.stop(actx.currentTime + dur);
    } catch {}
  }
  function avisoFin() { beep(660, 0.18); setTimeout(() => beep(880, 0.18), 170); setTimeout(() => beep(1175, 0.3), 360); }
  function vibrar(p) { if (navigator.vibrate) navigator.vibrate(p); }

  /* ===================== Eventos UI ===================== */
  $('btnMapaTop').addEventListener('click', irAlMapa);
  $('btnMapa2').addEventListener('click', irAlMapa);
  $('btnGlosario').addEventListener('click', abrirGlosario);
  $('btnGlosCerrar').addEventListener('click', () => $('modalGlosario').classList.remove('abierto'));
  $('modalGlosario').addEventListener('click', e => { if (e.target === $('modalGlosario')) $('modalGlosario').classList.remove('abierto'); });
  $('btnMapaModal').addEventListener('click', irAlMapa);
  $('btnSiguiente').addEventListener('click', () => { $('modalFin').classList.remove('abierto'); iniciarNivel(def.n + 1); });
  $('btnReintentar').addEventListener('click', () => { $('modalFin').classList.remove('abierto'); iniciarNivel(def.n); });
  $('btnEndless').addEventListener('click', entrarEndless);

  window.addEventListener('resize', () => { if (vista === 'juego') medir(); else if (vista === 'mapa') renderMapa(); });

  /* ===================== Arranque ===================== */
  mostrarVista('mapa');
  renderMapa();
  requestAnimationFrame(loop);

  /* ===================== PWA ===================== */
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
  }
  let deferredPrompt = null;
  const btnInstalar = $('btnInstalar');
  const yaInstalada = () => window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  if (!yaInstalada()) {
    window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; btnInstalar.style.display = ''; });
  }
  btnInstalar.addEventListener('click', async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt(); await deferredPrompt.userChoice;
    deferredPrompt = null; btnInstalar.style.display = 'none';
  });
  window.addEventListener('appinstalled', () => { btnInstalar.style.display = 'none'; deferredPrompt = null; });
</script>
  <script type="module" src="https://cdn.jsdelivr.net/npm/@closerclick/closer-click-support@0.3/src/index.js"></script>
